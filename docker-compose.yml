version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: buyora-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: buyorapassword
      POSTGRES_DB: buyora_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buyora-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:buyorapassword@postgres:5432/buyora_db?schema=public
      - JWT_SECRET=buyora_super_secure_jwt_secret_key_production_2026
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NODE_ENV=production
    depends_on:
      - postgres
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads

  # 3. Frontend Web Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buyora-frontend
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
